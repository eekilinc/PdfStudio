name: 'Release PDF Studio Pro'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: pdf.js 6 uses the Iterator Helpers proposal, which does
          # not exist in Node 20. The build happened to survive it because Vite
          # targets browsers, not the build host, but the test step would not.
          node-version: 22
          cache: 'npm'

      - name: Sync Project Version from Tag
        run: |
          node scripts/bump-version.js ${{ github.ref_name }}
        shell: bash

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PDF Studio Pro ${{ github.ref_name }}'
          releaseBody: 'Download the Windows installer below to install PDF Studio Pro.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
