name: 'CI'

# Runs on every change, not only on a release tag. Previously the only workflow
# was triggered by `push: tags: v*`, so a type error, a failing test or a lint
# warning could sit on main until the next release attempted to build it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: pdf.js 6 uses the Iterator Helpers proposal
          # (`Iterator.prototype.join`), which does not exist in Node 20. The
          # four suites that import the library transitively failed to load on
          # 20 while passing everywhere else.
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `build` runs `tsc -b` before Vite, and strict plus
      # noUncheckedIndexedAccess are on, so this is the gate that keeps an unsafe
      # array access or a null dereference from being committed.
      - name: Typecheck and bundle
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  rust:
    name: Rust backend
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check the Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
